name: LiftRank
options:
  bundleIdPrefix: com.liftrank
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LiftRank:
    type: application
    platform: iOS
    sources:
      - path: LiftRank
    configFiles:
      Debug: Config/AI.xcconfig
      Release: Config/AI.xcconfig
    info:
      path: LiftRank/Info.plist
      properties:
        CFBundleDisplayName: 段位健身
        LiftRankAIProvider: $(LIFTRANK_AI_PROVIDER)
        LiftRankAIModel: $(LIFTRANK_AI_MODEL)
        LiftRankAIBaseURL: $(LIFTRANK_AI_BASE_URL)
        LiftRankAIKey: $(LIFTRANK_AI_KEY)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 用于拍照记餐与扫描食品条码。
        NSHealthShareUsageDescription: 读取 Apple Watch 与健康 App 中的运动、心率与距离，导入有氧记录。
        NSHealthUpdateUsageDescription: 把手动记录的有氧运动写入健康 App，在 Fitness 中显示。
        NSMicrophoneUsageDescription: 用于语音输入训练指令。
        NSSpeechRecognitionUsageDescription: 把语音转换为文字，交给 AI 训练助手。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: LiftRank/LiftRank.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftrank.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - LiftRankTests
  LiftRankTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiftRankTests
    dependencies:
      - target: LiftRank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftrank.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
