name: LiftRank
options:
  bundleIdPrefix: com.liftrank
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: configuration/Build.xcconfig
  Release: configuration/Build.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LiftRank:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: LiftRank
        excludes:
          - Resources/SocialConfig.plist
          - Resources/GoogleService-Info.plist
    configFiles:
      Debug: Config/AI.xcconfig
      Release: Config/AI.xcconfig
    postBuildScripts:
      - name: Copy optional social configuration
        basedOnDependencyAnalysis: false
        script: |
          config_source="${LIFTRANK_SOCIAL_CONFIG_PATH:-$SRCROOT/LiftRank/Resources/SocialConfig.plist}"
          config_target="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/SocialConfig.plist"
          if [ -f "$config_source" ]; then
            cp "$config_source" "$config_target"
          else
            rm -f "$config_target"
          fi
    dependencies:
      - target: LiftRankLiveActivity
        embed: true
      - target: LiftRankWatch
        embed: true
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseStorage
    info:
      path: LiftRank/Info.plist
      properties:
        CFBundleDisplayName: 段位健身
        LiftRankAIProvider: $(LIFTRANK_AI_PROVIDER)
        LiftRankAIModel: $(LIFTRANK_AI_MODEL)
        LiftRankAIBaseURL: $(LIFTRANK_AI_BASE_URL)
        LiftRankAIKey: $(LIFTRANK_AI_KEY)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 用于拍照记餐与扫描食品条码。
        NSHealthShareUsageDescription: Read workouts, heart rate and distance for your LiftRank training session.
        NSHealthUpdateUsageDescription: Save LiftRank strength and cardio workouts to Apple Health and Fitness.
        NSMicrophoneUsageDescription: 用于语音输入训练指令。
        NSSpeechRecognitionUsageDescription: 把语音转换为文字，交给 AI 训练助手。
        NSLocationWhenInUseUsageDescription: Show your private outdoor workout route while LiftRank is open, and verify voluntary gym check-ins. Your coordinates are never shared with gym members.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.liftrank.cardio
            CFBundleURLSchemes: [liftrank]
    entitlements:
      path: LiftRank/LiftRank.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTRANK_APP_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - LiftRankTests
  LiftRankLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiftRankLiveActivity
      - path: Shared
    info:
      path: LiftRankLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: LiftRank Workout
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTRANK_APP_BUNDLE_IDENTIFIER).liveactivity
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LIFTRANK_WIDGET"
        APPLICATION_EXTENSION_API_ONLY: YES
  LiftRankWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LiftRankWatch
      - path: Shared
    info:
      path: LiftRankWatch/Info.plist
      properties:
        CFBundleDisplayName: LiftRank
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(LIFTRANK_APP_BUNDLE_IDENTIFIER)
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Read your live heart rate and workout energy during a LiftRank workout.
        NSHealthUpdateUsageDescription: Save your LiftRank workout to Apple Health and Fitness.
    entitlements:
      path: LiftRankWatch/LiftRankWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTRANK_APP_BUNDLE_IDENTIFIER).watchapp
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
  LiftRankTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiftRankTests
    dependencies:
      - target: LiftRank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTRANK_TEST_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  LiftRankSocialUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiftRankSocialUITests
    dependencies:
      - target: LiftRank
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LIFTRANK_UI_TEST_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LiftRank
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  LiftRankSocialRehearsal:
    build:
      targets:
        LiftRank: all
    test:
      targets:
        - LiftRankSocialUITests
